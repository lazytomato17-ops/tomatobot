name: Build Linux Engine

on:
  push:
    paths:
      - 'tomatobot-core/src/**'
      - 'tomatobot-core/Cargo.toml'
  workflow_dispatch: # 手動でも実行できるようにするボタン

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 完成品を自動プッシュするための許可証

    steps:
      - name: 📥 コードを取得
        uses: actions/checkout@v4

      - name: 🟢 Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🦀 Rustをセットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Linux用エンジンをビルド
        run: |
          cd tomatobot-core
          npm install
          npm run build

      - name: 🚀 完成品をリポジトリに自動納品
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --force tomatobot-core/*.node
          git commit -m "🤖 [自動生成] Linux用Rustエンジンを錬成" || echo "変更なし"
          git push