services:
  - type: web
    name: tomatobot
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/lazytomato17-ops/tomatobot
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISCORD_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TOMATOBOT_ANALYTICS_HMAC_SECRET
        generateValue: true
    autoDeploy: true
